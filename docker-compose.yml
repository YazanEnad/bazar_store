
services:
  catalog:
    build:
      context: .
      dockerfile: catalog_server/Dockerfile
    ports:
      - "5001:5001"
    environment:
      CATALOG_DB_PATH: /data/catalog.db
    volumes:
      - catalog_data:/data

  order:
    build:
      context: .
      dockerfile: order_server/Dockerfile
    ports:
      - "5002:5002"
    environment:
      CATALOG_SERVER_URL: http://catalog:5001
      ORDER_DB_PATH: /data/orders.db
    volumes:
      - order_data:/data
    depends_on:
      - catalog

  frontend:
    build:
      context: .
      dockerfile: frontend_server/Dockerfile
    ports:
      - "5000:5000"
    environment:
      CATALOG_SERVER_URL: http://catalog:5001
      ORDER_SERVER_URL: http://order:5002
    depends_on:
      - catalog
      - order

volumes:
  catalog_data:
  order_data:
